services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - grantcurrent_data:/data
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  grantcurrent_data:
